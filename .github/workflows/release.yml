name: "Release"
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # Node 22 LTS. esbuild.config.mjs is invoked with `node` by the build
      # script, so a runtime is still required alongside bun.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest





      # Installs from the committed bun.lock. `yarn` here found no lockfile and
      # resolved every dependency fresh on each run, so a newly published
      # transitive version could break a build that had not changed - which is
      # what broke the first 0.4.1 attempt: a fresh validate-npm-package-name
      # dropped support for the Node 21 this workflow pinned. --frozen-lockfile
      # makes the install reproducible and fails loudly on lockfile drift.
      - name: Build plugin
        run: |
          bun install --frozen-lockfile
          bun run build

      # `::set-output` is a deprecated command GitHub can disable at any time,
      # and it feeds the tag name straight into the release step. If it ever
      # stops working the step gets an empty tag and the release fails.
      - name: "Get the tag"
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Obsidian resolves a plugin by looking for a release tagged exactly as
      # the version in manifest.json. A tag that disagrees with the manifest
      # produces a release no client can find, which is what gets a plugin
      # dropped from community-plugins.json. Fail here instead.
      - name: Check the tag matches manifest.json
        run: |
          tag="${{ steps.get_tag.outputs.tag }}"
          manifest_version=$(jq -r .version manifest.json)
          if [ "$tag" != "$manifest_version" ]; then
            echo "Tag '$tag' does not match manifest.json version '$manifest_version'." >&2
            exit 1
          fi

      # Signs each released asset with a provenance statement tied to this
      # workflow run and this commit, so anyone can prove the binary was built
      # here from this source with `gh attestation verify main.js --repo
      # nhannht/obsidian-historica`. The directory review reports assets without
      # one. Runs before the release is created so no asset is ever downloadable
      # unattested. `permissions: write-all` above already grants the id-token
      # and attestations scopes this needs.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Published, not a draft. A draft release is invisible to Obsidian's
      # plugin fetcher, so a draft leaves master advertising a version that
      # no client can install - the state that got 0.4.1 delisted.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${{ steps.get_tag.outputs.tag }}

          # Only the three files Obsidian installs. The directory review flags
          # anything else as an unsupported extra, and it never downloads them.
          # LICENSE and README.md stay in the repo, where they are read.
          gh release create "$tag" \
          --title="$tag" \
          --notes-file=RELEASE_NOTES.md \
          main.js manifest.json styles.css

      



